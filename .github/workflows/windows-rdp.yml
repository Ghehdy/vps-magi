name: Windows Cloud RDP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2025

    # حداکثر زمان مجاز GitHub-hosted runner
    timeout-minutes: 360

    steps:

      - name: 1. Enable Remote Desktop
        shell: powershell
        run: |
          Write-Host "Enabling Remote Desktop..."

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name "fDenyTSConnections" `
            -Value 0

          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

          Write-Host "RDP enabled."

      - name: 2. Create Administrator
        shell: powershell
        run: |
          Write-Host "Creating administrator account..."

          $Password = ConvertTo-SecureString "CHANGE_THIS_PASSWORD" -AsPlainText -Force

          New-LocalUser `
            -Name "NvDAdmin" `
            -Password $Password `
            -PasswordNeverExpires `
            -ErrorAction SilentlyContinue

          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member "NvDAdmin" `
            -ErrorAction SilentlyContinue

          Write-Host "Administrator account ready."

      - name: 3. Install Tailscale
        shell: powershell
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          Write-Host "Installing Tailscale..."

          Invoke-WebRequest `
            "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" `
            -OutFile "C:\tailscale.msi"

          Start-Process `
            "msiexec.exe" `
            -ArgumentList "/i C:\tailscale.msi /quiet /norestart" `
            -Wait

          Start-Sleep -Seconds 10

          $Tailscale = "C:\Program Files\Tailscale\tailscale.exe"

          & $Tailscale up `
            --authkey="$Env:TAILSCALE_AUTHKEY" `
            --hostname="github-rdp-$env:GITHUB_RUN_ID"

          Start-Sleep -Seconds 10

          $ts_ip = & $Tailscale ip -4

          Write-Host ""
          Write-Host "============================================"
          Write-Host "        RDP SERVER IS READY"
          Write-Host "============================================"
          Write-Host "Tailscale IP : $ts_ip"
          Write-Host "Username     : NvDAdmin"
          Write-Host "============================================"

      - name: 4. Show System Resources
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "========== SYSTEM INFORMATION =========="

          Get-CimInstance Win32_ComputerSystem |
            Select-Object `
              @{Name="RAM_GB";Expression={[math]::Round($_.TotalPhysicalMemory / 1GB,2)}},
              NumberOfLogicalProcessors

          Write-Host ""
          Write-Host "Disk:"
          Get-PSDrive C |
            Select-Object `
              @{Name="Free_GB";Expression={[math]::Round($_.Free / 1GB,2)}},
              @{Name="Used_GB";Expression={[math]::Round(($_.Used) / 1GB,2)}}

          Write-Host "========================================="

      - name: 5. Keep Server Alive
        shell: powershell
        run: |
          Write-Host "Server is running."

          for ($i = 1; $i -le 350; $i++) {

            Start-Sleep -Seconds 60

            $minutes = $i
            $hours = [math]::Round($minutes / 60, 2)

            Write-Host "[$minutes/350] Server running... ($hours hours)"
          }
